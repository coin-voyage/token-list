name: Tokenlist

on:
  pull_request:
    paths:
      - "chains.json"
      - "package.json"
      - "scripts/build-tokenlist.mjs"
      - "tokens/**/*.json"
      - "tokenlist.json"
      - "tokenlist.preview.json"
      - ".github/workflows/tokenlist.yml"
  push:
    branches:
      - main
    paths:
      - "chains.json"
      - "package.json"
      - "scripts/build-tokenlist.mjs"
      - "tokens/**/*.json"
      - ".github/workflows/tokenlist.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.20.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tokenlist
        run: |
          pnpm run build:tokenlist
          pnpm run build:tokenlist:preview

      - name: Commit generated tokenlist
        if: github.event_name == 'push'
        run: |
          git add tokenlist.json tokenlist.preview.json
          if git diff --cached --quiet -- tokenlist.json tokenlist.preview.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build tokenlist"
          git push

      - name: Verify generated tokenlist is committed
        if: github.event_name == 'pull_request'
        run: |
          git add tokenlist.json tokenlist.preview.json
          git diff --cached --exit-code -- tokenlist.json tokenlist.preview.json
